[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unwritten"
version = "0.1.0"
description = "UNWRITTEN: evidence-backed verification of generated coding tasks"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
unwritten = "unwritten.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unwritten = ["runners/_inner/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["docker: needs a running Docker daemon"]
